<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiradas de Dados - Mouseguard Souls</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/tiradas.css">
</head>
<body>

  <main class="tiradas-container">
    <h1>Tiradas de Dados</h1>
    <p>Selecciona un dado para realizar una tirada.</p>

    <section class="dados-grid">
      <button class="btn-dado" data-dado="d4">D4</button>
      <button class="btn-dado" data-dado="d6">D6</button>
      <button class="btn-dado" data-dado="d8">D8</button>
      <button class="btn-dado" data-dado="d10">D10</button>
      <button class="btn-dado" data-dado="d12">D12</button>
      <button class="btn-dado" data-dado="d20">D20</button>
      <button class="btn-dado" data-dado="d100">D100</button>
    </section>

    <section class="resultado-card">
      <div id="dadoAnimado" class="dado-animado">🎲</div>
      <h2 id="tipoDado">Esperando tirada...</h2>
      <p id="resultadoDado">Presiona un botón para tirar.</p>
    </section>

    <a href="dashboard.html" class="volver">Volver al menú</a>
  </main>

  <script src="tiradas.js"></script>
</body>
</html>
